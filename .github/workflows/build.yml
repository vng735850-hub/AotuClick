name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept licenses and install Android SDK 34
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Find Gradle project
        id: proj
        run: |
          f=$(find . -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then
            echo "::error::Khong tim thay settings.gradle(.kts) trong repo"
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Project dir: $(dirname "$f")"

      - name: Clean resources (remove icon files that break resource merge)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          RES=app/src/main/res
          rm -rf "$RES/drawable" "$RES/mipmap-anydpi-v26" "$RES/values/colors.xml"
          sed -i '/android:icon=/d' app/src/main/AndroidManifest.xml
          cat > "$RES/values/strings.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Nvp Klick</string>
              <string name="service_desc">Cho ph\u00e9p Nvp Klick th\u1ef1c hi\u1ec7n thao t\u00e1c ch\u1ea1m, gi\u1eef, k\u00e9o t\u1ef1 \u0111\u1ed9ng tr\u00ean m\u00e0n h\u00ecnh.</string>
          </resources>
          XML
          sed -i 's/^          //' "$RES/values/strings.xml"
          echo "--- Resource files ---"
          find "$RES" -type f | sort
          echo "--- strings.xml ---"
          cat "$RES/values/strings.xml"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show errors
        if: failure()
        run: |
          echo "=== What went wrong ==="
          grep -n -E "^e: |What went wrong" -A4 build.log 2>/dev/null | head -40 || true
          echo "=== Caused by ==="
          grep -n -E "Caused by" -A10 build.log 2>/dev/null | head -60 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NvpKlick-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error